name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Verify committed RxJS 7.8.2 export oracle
        run: npm run oracle:exports:check
      - name: Verify current milestone
        run: npm run verify
